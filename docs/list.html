<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="./theme-init.js?v=site-theme-14"></script>
    <title>投稿一覧 | リサイクルセンター</title>
    <link rel="stylesheet" href="./style.css?v=public-ui-touchup-03-patch1">
    <link rel="stylesheet" href="./site-header.css?v=public-ui-refinement-patch-02">
  <link rel="stylesheet" href="./list.css?v=public-ui-touchup-03-patch1">
  <link rel="stylesheet" href="./version-management-ui.css?v=public-ui-touchup-03-patch1">
    <link rel="stylesheet" href="./theme.css?v=public-ui-refinement-01">
  <link rel="stylesheet" href="./version-comment-ui.css?v=public-ui-touchup-03-patch1">
  </head>
  <body id="top">
    <div class="page-shell">
      <header class="site-header" data-site-header data-current-page="list">
        <a class="site-brand-fallback" href="./index.html#top">リサイクルセンター</a>
      </header>

      <main class="compact-list-page">
        <header class="compact-list-header">
          <h1 data-copy-key="list-page-title">投稿一覧</h1>
          <p data-copy-key="list-page-description">公開中の譜面の一覧を表示します。</p>
        </header>

        <section class="compact-search" aria-labelledby="compactSearchHeading">
          <h2 id="compactSearchHeading">検索</h2>
          <div class="compact-filter-panel">
            <form id="compactSearchForm" class="compact-search-form" role="search">
              <label for="compactSearchInput" data-copy-key="list-search-label">曲名・アーティスト・差分名・差分作者</label>
              <div class="compact-search-controls">
                <input
                  id="compactSearchInput"
                  name="q"
                  type="search"
                  maxlength="100"
                  autocomplete="off"
                  placeholder="曲名・アーティスト・差分名・差分作者"
                >
                <button type="submit" data-copy-key="list-search-submit">検索</button>
                <button id="compactSearchClear" class="secondary" type="button">クリア</button>
              </div>
            </form>

            <div class="compact-filter-groups">
              <div class="compact-filter-row">
                <span class="compact-filter-label" aria-hidden="true">状態</span>
                <fieldset class="compact-filter-fieldset">
                  <legend class="visually-hidden">状態</legend>
                  <div class="compact-radio-group compact-status-options">
                    <label class="compact-radio-choice"><input type="radio" name="compactStatusGroup" value="all"><span data-copy-key="list-status-all">すべて</span></label>
                    <label class="compact-radio-choice"><input type="radio" name="compactStatusGroup" value="incomplete"><span data-copy-key="list-status-incomplete">制作途中</span></label>
                    <label class="compact-radio-choice"><input type="radio" name="compactStatusGroup" value="finished"><span>完成済み</span></label>
                  </div>
                </fieldset>
              </div>

              <div class="compact-filter-row compact-finished-subtypes" id="compactFinishedSubtypes" aria-hidden="true" hidden>
                <span class="compact-filter-label" aria-hidden="true">完成済みの種類</span>
                <fieldset class="compact-filter-fieldset">
                  <legend class="visually-hidden">完成済みの種類</legend>
                  <div class="compact-radio-group compact-status-options">
                    <label class="compact-radio-choice"><input type="radio" name="compactFinishedStatus" value="finished"><span data-copy-key="list-status-finished">完成＋没譜面</span></label>
                    <label class="compact-radio-choice"><input type="radio" name="compactFinishedStatus" value="complete"><span data-copy-key="list-status-complete">通常完成</span></label>
                    <label class="compact-radio-choice"><input type="radio" name="compactFinishedStatus" value="rejected"><span data-copy-key="list-status-rejected">没譜面</span></label>
                  </div>
                </fieldset>
              </div>

              <div class="compact-filter-row">
                <span class="compact-filter-label" aria-hidden="true">基準</span>
                <fieldset class="compact-filter-fieldset">
                  <legend class="visually-hidden">並び順と期間の基準</legend>
                  <div class="compact-radio-group compact-sort-options">
                    <label class="compact-radio-choice"><input type="radio" name="compactSort" value="new"><span data-copy-key="list-sort-new">新着順</span></label>
                    <label class="compact-radio-choice"><input type="radio" name="compactSort" value="updated"><span data-copy-key="list-sort-updated">更新順</span></label>
                  </div>
                </fieldset>
              </div>

              <details class="compact-date-filter-row" id="compactDateDetails">
                <summary id="compactDateFilterLabel">期間を指定</summary>
                <div class="compact-date-filter" role="group" aria-labelledby="compactDateFilterLabel">
                  <div class="compact-date-controls">
                    <label><span>開始日</span><input id="compactDateFrom" type="date" aria-describedby="compactDateError"></label>
                    <span class="compact-date-separator">から</span>
                    <label><span>終了日</span><input id="compactDateTo" type="date" aria-describedby="compactDateError"></label>
                    <button id="compactDateApply" class="secondary" type="button">適用</button>
                  </div>
                  <p id="compactDateError" class="compact-date-error" role="alert" hidden></p>
                  <div id="compactDateShortcuts" class="compact-date-shortcuts" aria-label="期間のショートカット">
                    <button class="secondary" type="button" data-date-shortcut="today">今日</button>
                    <button class="secondary" type="button" data-date-shortcut="week">今週</button>
                    <button class="secondary" type="button" data-date-shortcut="month">今月</button>
                    <button class="secondary" type="button" data-date-shortcut="year">今年</button>
                    <button class="secondary" type="button" data-date-shortcut="none">指定なし</button>
                  </div>
                </div>
              </details>

              <div class="compact-filter-row">
                <span class="compact-filter-label" aria-hidden="true">その他</span>
                <fieldset class="compact-filter-fieldset">
                  <legend class="visually-hidden">その他の条件</legend>
                  <label class="compact-favorite-filter">
                    <input id="compactFavoriteOnly" type="checkbox">
                    <span data-copy-key="list-favorites-only">お気に入りのみ</span>
                  </label>
                </fieldset>
              </div>
            </div>
          </div>
          <div id="compactActiveFilters" class="compact-active-filters" aria-label="適用中の条件" hidden></div>
          <p id="compactListSummary" class="compact-list-summary" aria-live="polite">一覧を読み込んでいます。</p>
        </section>

        <section class="compact-results" aria-labelledby="compactResultsHeading">
          <h2 id="compactResultsHeading" class="visually-hidden">検索結果</h2>
          <div class="compact-list-head" aria-hidden="true">
            <span id="compactDateHeading" class="list-heading-date">投稿日</span>
            <span class="list-heading-chart">譜面</span>
            <span class="list-heading-meta">難易度・作者</span>
            <span class="list-heading-progress">進捗</span>
            <span class="list-heading-comment">コメント</span>
            <span class="list-heading-actions">操作</span>
          </div>
          <div id="compactVersionList" class="compact-version-list" aria-busy="true">
            <p class="compact-list-state" data-copy-key="list-loading">読み込み中...</p>
          </div>
          <p id="compactListFeedback" class="compact-list-feedback" role="status" aria-live="polite" hidden></p>
          <div class="compact-retry-row">
            <button id="compactListRetry" class="secondary" type="button" hidden>再試行</button>
          </div>
          <nav id="compactPagination" class="compact-pagination" aria-label="投稿一覧のページ" hidden></nav>
        </section>
      </main>
    </div>

    <dialog class="version-management-dialog" id="versionManagementDialog" aria-labelledby="versionManagementTitle">
      <form class="version-management-panel" id="versionManagementForm" novalidate>
        <div class="version-management-header">
          <h2 id="versionManagementTitle">削除確認</h2>
          <button class="version-management-close" type="button" data-version-management-close aria-label="閉じる">×</button>
        </div>

        <dl class="version-management-summary">
          <div><dt>版</dt><dd id="versionManagementVersion">-</dd></div>
          <div><dt>作者</dt><dd id="versionManagementAuthor">-</dd></div>
          <div><dt>状態</dt><dd id="versionManagementState">-</dd></div>
          <div><dt>投稿日時</dt><dd id="versionManagementCreatedAt">-</dd></div>
          <div><dt>処理予定</dt><dd id="versionManagementSchedule">-</dd></div>
          <div><dt>ダウンロード</dt><dd id="versionManagementDownload">-</dd></div>
          <div><dt>追記受付</dt><dd id="versionManagementAllowAppend">-</dd></div>
        </dl>

        <label class="field">
          <span class="field-label">管理パスワード <span class="required-mark">*</span></span>
          <input id="versionManagementPassword" type="password" autocomplete="current-password" required>
          <span class="field-help">投稿時の管理パスワードを入力してください。公開されず、再発行できません。</span>
        </label>

        <section class="version-management-action" aria-labelledby="withdrawalActionTitle">
          <h3 id="withdrawalActionTitle">投稿を取り下げる</h3>
          <p id="versionWithdrawalDescription">対象の状態を確認しています。</p>
          <label class="field version-withdrawal-reason" id="versionWithdrawalReasonField" hidden>
            <span class="field-label">取り下げ理由 <span class="required-mark">*</span></span>
            <textarea id="versionWithdrawalReason" rows="4" minlength="10" maxlength="500"></textarea>
            <span class="field-help">管理者確認や、申請期間中に派生版・参照が追加された場合の判断に使用します。</span>
          </label>
          <div class="version-management-buttons">
            <button class="version-withdrawal-action-button" id="versionWithdrawalActionButton" type="button" disabled>確認中…</button>
          </div>
        </section>

        <p class="version-management-message" id="versionManagementMessage" role="status" aria-live="polite" hidden></p>
        <div class="version-management-buttons">
          <button class="secondary version-management-cancel-button" type="button" data-version-management-close data-copy-key="management-cancel">キャンセル</button>
        </div>
      </form>
    </dialog>

    <script src="./theme-controller.js?v=public-ui-refinement-01"></script>
    <script src="./site-header.js?v=public-ui-refinement-01"></script>
    <script src="./version-ui-model.js?v=public-ui-touchup-03-patch1"></script>
    <script src="./version-link-ui.js?v=public-ui-refinement-01"></script>
  <script src="./version-action-ui.js?v=comment-action-balance-01"></script>
    <script src="./version-comment-ui.js?v=public-ui-touchup-03-patch1"></script>
    <script src="./list.js?v=public-ui-touchup-03-patch1"></script>
    <script src="./version-management-ui.js?v=public-ui-refinement-patch-02"></script>
  </body>
</html>
