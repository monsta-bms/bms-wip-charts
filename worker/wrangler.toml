name = "bms-wip-charts-worker"
main = "src/index.ts"
compatibility_date = "2026-06-28"
workers_dev = true

[triggers]
crons = ["0 18 * * *", "0 * * * *"]

[vars]
# カンマ区切りで複数Originを許可する。ブラウザのOriginはパスを含まない。
ALLOWED_ORIGINS = "https://monsta-bms.github.io,http://localhost:8787"
WITHDRAWAL_CRON_MODE = "active"

[secrets]
required = [
  "ADMIN_TOKEN",
  "PASSWORD_HASH_SECRET",
  "ABUSE_HASH_SECRET",
  "WITHDRAWAL_IDEMPOTENCY_SECRET",
  "TURNSTILE_SECRET",
  "TURNSTILE_MODE"
]

[[d1_databases]]
binding = "DB"
database_name = "wip-bms-charts-db"
database_id = "d55ed399-5a31-43a0-89d4-9bd2f32ba3a7"

[[r2_buckets]]
binding = "FILES"
bucket_name = "wip-bms-charts-files"

# 秘密情報はこのファイルに書かず、Cloudflare secrets で設定する。
# 想定secret:
# - ADMIN_TOKEN
# - PASSWORD_HASH_SECRET
# - ABUSE_HASH_SECRET
# - WITHDRAWAL_IDEMPOTENCY_SECRET
# - TURNSTILE_SECRET
# - TURNSTILE_MODE
