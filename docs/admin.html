<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>削除申請管理 | BMS制作途中譜面共有</title>
    <link rel="stylesheet" href="./admin.css?v=admin-delete-01">
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="admin-kicker">BMS WIP CHARTS</p>
          <h1>削除申請管理</h1>
        </div>
        <span class="admin-environment">pending queue</span>
      </header>

      <section class="admin-auth" aria-labelledby="adminAuthTitle">
        <div>
          <h2 id="adminAuthTitle">管理者認証</h2>
          <p>ADMIN_TOKENはこのページのメモリ内だけに保持されます。</p>
        </div>
        <form id="adminAuthForm" class="admin-auth-form">
          <label for="adminToken">ADMIN_TOKEN</label>
          <div class="admin-auth-controls">
            <input id="adminToken" name="adminToken" type="password" autocomplete="off" required>
            <button type="submit">読み込む</button>
          </div>
        </form>
      </section>

      <p id="adminStatus" class="admin-status" role="status" hidden></p>

      <section class="admin-queue" aria-labelledby="adminQueueTitle">
        <div class="admin-queue-header">
          <div>
            <h2 id="adminQueueTitle">pending削除申請</h2>
            <p id="adminQueueSummary">認証後に一覧を読み込みます。</p>
          </div>
          <button id="adminRefreshButton" type="button" class="secondary-button" disabled>再読み込み</button>
        </div>

        <div class="admin-list-header" aria-hidden="true">
          <span>申請</span>
          <span>対象version</span>
          <span>現在状態</span>
          <span>処理</span>
        </div>
        <div id="adminRequestList" class="admin-request-list"></div>

        <nav class="admin-pagination" aria-label="削除申請ページ">
          <button id="adminPreviousPage" type="button" class="secondary-button" disabled>前へ</button>
          <span id="adminPageStatus">1 / 1</span>
          <button id="adminNextPage" type="button" class="secondary-button" disabled>次へ</button>
        </nav>
      </section>
    </main>

    <dialog id="adminDecisionDialog" class="admin-dialog">
      <form id="adminDecisionForm" class="admin-dialog-panel">
        <header class="admin-dialog-header">
          <div>
            <p id="adminDecisionType" class="admin-dialog-type"></p>
            <h2 id="adminDecisionTitle">削除申請を処理</h2>
          </div>
          <button type="button" class="dialog-close" data-admin-dialog-close aria-label="閉じる">×</button>
        </header>

        <dl class="admin-dialog-summary">
          <div><dt>曲名</dt><dd id="adminDecisionSong"></dd></div>
          <div><dt>差分</dt><dd id="adminDecisionChart"></dd></div>
          <div><dt>版</dt><dd id="adminDecisionVersion"></dd></div>
          <div><dt>直接子</dt><dd id="adminDecisionChildren"></dd></div>
        </dl>

        <label for="adminDecisionNote">管理メモ</label>
        <textarea id="adminDecisionNote" name="adminNote" rows="5" maxlength="1000"></textarea>
        <p id="adminDecisionHint" class="admin-dialog-hint"></p>
        <p id="adminDecisionMessage" class="admin-dialog-message" role="alert" hidden></p>

        <div class="admin-dialog-actions">
          <button type="button" class="secondary-button" data-admin-dialog-close>キャンセル</button>
          <button id="adminDecisionSubmit" type="submit">実行</button>
        </div>
      </form>
    </dialog>

    <script src="./admin.js?v=admin-delete-01"></script>
  </body>
</html>
